name: Secret Scanning (TruffleHog)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

jobs:
  trufflehog:
    name: TruffleHog Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: TruffleHog (Recent commits)
        uses: trufflesecurity/trufflehog@82df476e759c1448517fac6bfb3677685cdcd78a
        with:
          path: ./
          extra_args: --results=verified,unknown
