services:
  highfish-api-db:
    image: ghcr.io/jbkunama1/hai.highfishagentenapidb:latest
    container_name: highfish-api-db
    ports:
      - "5555:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/highfish.db
      # Auth: Mindestens API_KEY ODER AUTH_USER+AUTH_PASSWORD setzen!
      - API_KEY=${API_KEY:-}
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # CORS-Whitelist an deine tatsächliche Domain anpassen
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      # Telegram-Bot (optional; ohne TELEGRAM_BOT_TOKEN bleibt der Bot inaktiv)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
    volumes:
      - highfish-data:/data
      - /home/APIBACKUP:/backup
    restart: unless-stopped
    networks:
      - highfishNetwork

volumes:
  highfish-data:
    driver: local

networks:
  highfishNetwork:
    name: highfishNetwork
    external: true
