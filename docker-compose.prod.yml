services:
  highfish-api-db:
    image: ghcr.io/jbkunama1/hai.highfishagentenapidb:latest
    container_name: highfish-api-db
    ports:
      - "5555:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/highfish.db
      # Auth: Mindestens API_KEY ODER AUTH_USER+AUTH_PASSWORD setzen!
      - API_KEY=${API_KEY:-}
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # CORS-Whitelist an deine tatsÃ¤chliche Domain anpassen
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - highfish-data:/data
      - highfish-backups:/backups
    restart: unless-stopped
    networks:
      - highfishNetwork

volumes:
  highfish-data:
    driver: local
  highfish-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/backups/highfish-db

networks:
  highfishNetwork:
    name: highfishNetwork
    external: true

