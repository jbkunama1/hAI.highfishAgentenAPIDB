version: '3.8'

services:
  highfish-api-db:
    build: .
    container_name: highfish-api-db
    networks:
      - highfishNetwork
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/highfish.db
      # Auth: Mindestens API_KEY ODER AUTH_USER+AUTH_PASSWORD setzen!
      - API_KEY=${API_KEY:-}
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - highfish-data:/data
      - highfish-backups:/backups
    restart: unless-stopped
    labels:
      - "com.example.description=HighFish API DB - API Key Management"

  highfish-telegram-bot:
    build: ./bot
    container_name: highfish-telegram-bot
    networks:
      - highfishNetwork
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:-}
      - DB_PATH=/data/bot.db
      - API_BASE_URL=http://highfish-api-db:3000
      - API_KEY=${API_KEY:-}
    volumes:
      - bot-data:/data
    restart: unless-stopped
    labels:
      - "com.example.description=HighFish Telegram Admin Bot"

volumes:
  highfish-data:
    driver: local
  bot-data:
    driver: local
  highfish-backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/backups/highfish-db

networks:
  highfishNetwork:
    name: highfishNetwork
    external: true

