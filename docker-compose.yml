version: '3.8'

services:
  highfish-api-db:
    build: .
    container_name: highfish-api-db
    networks:
      - highfishNetwork
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/highfish.db
      # Auth: Mindestens API_KEY ODER AUTH_USER+AUTH_PASSWORD setzen!
      - API_KEY=${API_KEY:-}
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - haiapidb_highfish-data:/data
    restart: unless-stopped
    labels:
      - "com.example.description=HighFish API DB - API Key Management"

volumes:
  haiapidb_highfish-data:
    external: true

networks:
  highfishNetwork:
    name: highfishNetwork
    external: true
