<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="favicon/favicon.ico">
        <title>HighFish API DB - API Management</title>
    <style>
        :root {
            --bg-deep: #0b0e17;
            --panel-bg: #121729;
            --panel-sec: #171e33;
            --border-color: rgba(255,255,255,0.08);
            --text-main: #eef1fb;
            --text-muted: #9aa3c0;
            --accent-1: #7c5cff;
            --accent-2: #ff5c8a;
            --accent-3: #24d1c4;
            --accent-4: #ffb84c;
            --radius-lg: 22px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        .category-badge {
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 11px;
            white-space: nowrap;
            color: #fff;
            background-color: #64748b;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cat-LLM { background-color: var(--cat-llm); }
        .cat-Picture { background-color: var(--cat-picture); }
        .cat-Media { background-color: var(--cat-media); }
        .cat-Video { background-color: var(--cat-video); }
        .cat-Security { background-color: var(--cat-security); }
        .cat-Github { background-color: var(--cat-github); }
        .cat-Google { background-color: var(--cat-google); }
        .cat-Other { background-color: var(--cat-other); }
        .cat-MCP { background-color: #2dd4bf; }
        .cat-Mail { background-color: #38bdf8; }
        .cat-Finance { background-color: #4ade80; }
        .cat-Bot { background-color: #c084fc; }
        .cat-HomeAutomation { background-color: #fda4af; }
        .cat-9router { background-color: #facc15; }
        .cat-default { background-color: #64748b; }


        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        /* Glassmorphism Panels */
        .panel {
            background: rgba(18, 23, 41, 0.85);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            padding: 24px;
        }

        /* Buttons & Inputs */
        button, .btn {
            border-radius: 999px; /* Pills */
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
        }

        input, textarea {
            background: var(--panel-sec);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            padding: 10px 14px;
        }
        
        input:focus, textarea:focus {
            box-shadow: 0 0 0 3px rgba(124,92,255,0.25);
            border-color: var(--accent-1);
            outline: none;
        }
        
        /* Animated background blobs */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .bg-blob-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
            background: radial-gradient(circle, var(--accent-1), transparent);
            animation-delay: 0s;
        }

        .bg-blob-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: -50px;
            background: radial-gradient(circle, var(--accent-2), transparent);
            animation-delay: -7s;
        }

        .bg-blob-3 {
            width: 250px;
            height: 250px;
            top: 40%;
            left: 50%;
            background: radial-gradient(circle, var(--accent-3), transparent);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.05); }
            50% { transform: translate(-20px, 30px) scale(0.95); }
            75% { transform: translate(10px, 20px) scale(1.02); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--card-border);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            box-shadow: 0 4px 15px var(--glow-strong);
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logout-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .hamburger-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 44px;
            height: 44px;
            background: var(--surface-glow);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            padding: 10px;
            flex-shrink: 0;
        }

        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .drawer-overlay.open {
            display: block;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            max-width: 80vw;
            background: var(--drawer-bg);
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            padding: 20px;
            border-right: 1px solid var(--card-border);
            overflow-y: auto;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
            float: right;
            padding: 0;
        }

        .drawer-close:hover {
            color: var(--text-color);
        }

        .drawer ul {
            list-style: none;
            margin-top: 30px;
            clear: both;
        }

        .drawer ul li {
            margin-bottom: 5px;
        }

        .drawer ul li a {
            display: block;
            padding: 12px 14px;
            border-radius: 8px;
            color: var(--muted-2);
            text-decoration: none;
            font-size: 15px;
            transition: all 0.2s;
        }

        .drawer ul li a:hover {
            background: var(--surface-glow);
            color: var(--accent);
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
        }

        .export-menu {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            min-width: 180px;
            background: var(--drawer-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 100;
            overflow: hidden;
        }

        .export-menu.open {
            display: block;
        }

        .export-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 12px 16px;
            color: var(--muted-2);
            font-size: 14px;
            cursor: pointer;
            border-radius: 0;
        }

        .export-menu button:hover {
            background: var(--surface-glow);
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--bg-color) 0%, var(--card-bg) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--card-border);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--accent);
            font-size: 24px;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px var(--glow-strong);
            overflow: hidden;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted-2);
            font-size: 14px;
            font-weight: 500;
        }

        input[type="password"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--surface-glow);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
            font-family: monospace;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
                    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--glow-strong);
        }

        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .main-content {
            display: none;
        }

        .main-content.active {
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
                    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--glow-strong);
        }

        .btn-secondary {
            background-color: var(--surface-2);
            color: var(--muted-2);
        }

        .btn-secondary:hover {
            background-color: var(--surface-2-hover);
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-content form {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .modal-header {
            font-size: 17px;
            margin-bottom: 12px;
            color: var(--accent);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .modal-body {
            margin-bottom: 14px;
            overflow-y: auto;
            min-height: 0;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .admin-modal h3 {
            font-size: 13px;
            margin: 12px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-modal .modal-body button {
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 6px;
            text-align: left;
        }

        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .list-mode {
            grid-template-columns: 1fr !important;
        }
        .grid-2col {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        .grid-3col {
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        }
                /* Kompakt-Ansicht */
                body.compact-mode .api-grid { gap: 12px; }
                body.compact-mode .api-card { padding: 14px 16px; }
                body.compact-mode .api-name { font-size: 15px; }
                body.compact-mode .api-key { font-size: 11px; padding: 7px; }
                body.compact-mode .card-actions button { padding: 6px; font-size: 11px; }
                /* Kachel-Ansicht */
                body.tile-mode .api-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
                body.tile-mode .api-card { padding: 14px; }
                body.tile-mode .api-key { font-size: 11px; flex-direction: column; align-items: center; }
                body.tile-mode .card-actions { flex-direction: column; }

        @media (max-width: 768px) {
            .api-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }

            .header-content {
                width: 100%;
                justify-content: flex-start;
                gap: 10px;
            }

            .hamburger-btn {
                display: flex;
            }

            h1 {
                font-size: 18px;
            }

            .controls {
                flex-direction: column;
            }

            .controls button,
            .controls .search-box {
                width: 100%;
            }

            .export-dropdown {
                width: 100%;
            }

            .export-dropdown > button {
                width: 100%;
            }

            .export-menu {
                position: static;
                margin-top: 4px;
                width: 100%;
            }

            button {
                width: 100%;
            }

            .logo {
                width: 40px;
                height: 40px;
            }

                        /* Admin modal mobile adjustments */
                        .admin-modal .modal-content {
                            width: 95%;
                            max-width: none;
                            max-height: 90vh;
                            border-radius: 16px 16px 0 0;
                            margin: auto 0 0 0;
                            display: flex;
                            flex-direction: column;
                        }

                        .admin-modal .modal-body {
                            overflow-y: auto;
                            max-height: 60vh;
                            padding-right: 10px;
                        }
                    }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .admin-modal .modal-content {
                padding: 20px;
                width: 95%;
                max-height: 90vh;
                display: flex;
                flex-direction: column;
            }
            
                        .admin-modal .modal-body {
                overflow-y: auto;
                max-height: 60vh;
            }

            .card-actions {
                flex-direction: column;
            }
        }

        .api-card {
                    background: var(--card-bg);
                    border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .api-card:hover {
                    border-color: var(--accent);
                    box-shadow: 0 8px 25px color-mix(in srgb, var(--accent) 10%, transparent);
            transform: translateY(-4px);
        }

        .api-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
                    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
        }

        .api-name {
            font-size: 18px;
            font-weight: 600;
                    color: var(--accent);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .api-key {
                    background: color-mix(in srgb, var(--bg-color) 60%, var(--card-bg) 40%);
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            color: var(--muted-2);
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .copy-btn {
                    background: var(--accent);
                    color: var(--bg-color);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .copy-btn:hover {
                    background: var(--accent-2);
        }

        .api-notes {
            color: var(--muted);
            font-size: 13px;
            margin-top: 10px;
            padding-top: 10px;
                    border-top: 1px solid var(--card-border);
            max-height: 60px;
            overflow-y: auto;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .card-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .success-message {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            color: #86efac;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--surface-glow);
        }

        .statusbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px 16px;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 14px;
            white-space: nowrap;
        }

        .statusbar strong {
            color: var(--accent);
            font-weight: 600;
        }

                /* Design-Spezifika: Alle Themes nutzen jetzt die CSS-Variablen,
                   daher sind hier nur noch layout- bzw. strukturelle Abweichungen nötig. */

                                /* ===== SaaS-Marktplatz-Design ===== */
                                body.saas-market .api-grid {
                                    grid-template-columns: repeat(3, 1fr);
                                    gap: 20px;
                                }
                                @media (max-width: 900px) { body.saas-market .api-grid { grid-template-columns: repeat(2, 1fr); } }
                                @media (max-width: 600px) { body.saas-market .api-grid { grid-template-columns: 1fr; } }

                                body.saas-market .mk-card {
                                    background: var(--card-bg);
                                    border: 1px solid var(--card-border);
                                    border-radius: 14px;
                                    box-shadow: 0 4px 16px rgba(17, 24, 39, 0.06);
                                    padding: 20px;
                                    display: flex;
                                    flex-direction: column;
                                    gap: 12px;
                                }
                                body.saas-market .mk-card:hover {
                                    border-color: var(--accent);
                                    box-shadow: 0 12px 28px rgba(17, 24, 39, 0.10);
                                }
                                body.saas-market .mk-card::before { display: none; }

                                body.saas-market .mk-head { display: flex; align-items: center; gap: 12px; }
                                body.saas-market .mk-icon {
                                    width: 42px;
                                    height: 42px;
                                    border-radius: 10px;
                                    color: #fff;
                                    font-size: 20px;
                                    font-weight: 700;
                                    display: flex;
                                    align-items: center;
                                    justify-content: center;
                                    flex-shrink: 0;
                                }
                                body.saas-market .mk-title { flex: 1; min-width: 0; }

                                                                body.saas-market .mk-arrow { font-size: 15px; line-height: 1; }

                                body.saas-market .modal-header { color: var(--text-color); border-bottom-color: var(--card-border); }

                                body.saas-market input:focus, body.saas-market textarea:focus, body.saas-market .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--surface-glow); }

                                body.saas-market .btn-secondary { background-color: var(--surface-2); color: var(--muted-2); }
                                body.saas-market .export-menu { background: var(--drawer-bg); border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(17, 24, 39, 0.12); }
                                body.saas-market .export-menu button { color: var(--muted-2); }
                                body.saas-market .drawer { background: var(--drawer-bg); border-right-color: var(--card-border); }

                                body.saas-market .login-container { background: var(--card-bg); border: 1px solid var(--card-border); box-shadow: 0 20px 60px rgba(17, 24, 39, 0.12); }
                                body.saas-market .login-container h2 { color: var(--accent); }

                                a[href]:not(.mk-globe)::before {
                                    content: "🔗"; /* You can choose a different emoji here */

</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="login-logo">
                <img src="./highfishapidblogo.png" alt="HighFish API DB Logo">
            </div>
            <h2>HighFish API DB</h2>
            <div class="error-message" id="loginError"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="password">API-Key</label>
                    <input type="password" id="password" placeholder="Gib deinen API-Key ein" autocomplete="off" required>
                </div>
                <button type="submit" class="login-btn">Anmelden</button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div class="main-content" id="mainContent">
        <div class="container">
            <!-- Statusleiste -->
            <div class="statusbar" id="statusbar">
                <span>🔑 <strong id="apiCount">0</strong> APIs</span>
                <span>🕒 Letztes Update: <span id="lastUpdate">-</span></span>
            </div>

            <!-- Header -->
            <header>
                <div class="header-content">
                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menü öffnen" onclick="toggleMenu()">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="logo">
                        <img src="./highfishapidblogo.png" alt="HighFish API DB Logo">
                    </div>
                    <h1>HighFish API DB</h1>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Abmelden</button>
            </header>

            <!-- Drawer / Mobile Menu -->
            <div class="drawer-overlay" id="drawerOverlay" onclick="closeMenu()"></div>
            <nav class="drawer" id="drawer" aria-label="Mobile Navigation">
                <button class="drawer-close" onclick="closeMenu()" aria-label="Menü schließen">✕</button>
                <ul>
                    <li><a href="#" onclick="openAddModal(); closeMenu();">＋ Neue API</a></li>
                    <li><a href="#" onclick="openAdmin(); closeMenu();">⚙️ Admin‑Einstellungen</a></li>
                </ul>
            </nav>

            <!-- Success Message -->
            <div class="success-message" id="successMsg"></div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn-primary" onclick="openAddModal()">+ Neue API</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Nach API-Name suchen..." onkeyup="filterAPIs()">
                </div>
            </div>

            <!-- API Grid -->
            <div id="apiContainer" class="api-grid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <p style="font-size: 40px; margin-bottom: 10px;">📭</p>
                <p>Noch keine APIs gespeichert.</p>
                <p style="font-size: 12px; margin-top: 5px;">Klicke auf "Neue API" um eine hinzuzufügen.</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="apiModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Neue API</div>
            <form onsubmit="handleSaveAPI(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="apiName">API Name *</label>
                        <input type="text" id="apiName" placeholder="z.B. GitHub API" required>
                    </div>
                    <div class="form-group">
                        <label for="apiCategory">Kategorie (optional)</label>
                        <select id="apiCategory">
                            <option value="">— keine Auswahl —</option>
                            <option>LLM</option>
                            <option>Picture</option>
                            <option>Media</option>
                            <option>Video</option>
                            <option>Security</option>
                            <option>Github</option>
                            <option>Google</option>
                            <option>9router</option>
                            <option>MCP</option>
                            <option>Other</option>
                            <option>Mail</option>
                            <option>Finance</option>
                            <option>Bot</option>
                            <option>HomeAutomation</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="apiUrl">API URL (optional)</label>
                        <input type="text" id="apiUrl" placeholder="z.B. https://api.github.com">
                    </div>
                    <div class="form-group">
                        <label for="apiKey">API Key *</label>
                        <input type="text" id="apiKey" placeholder="Dein geheimer API-Schlüssel" required>
                    </div>
                    <div class="form-group">
                        <label for="apiNotes">Notizen (optional)</label>
                        <textarea id="apiNotes" placeholder="Zusätzliche Informationen, Endpoint, Gültigkeitsdauer, etc."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Abbrechen</button>
                    <button type="submit" class="btn-primary">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let currentEditId = null;
        let allAPIs = [];
        let lastUpdated = null;
        let isAuthenticated = false;
        // API-Key für die Backend-Authentifizierung wird zur Laufzeit validiert,
        // nicht im Client hartcodiert.
        let apiKey = null;

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const auth = localStorage.getItem('hf_auth');
            if (auth === 'true') {
                // Key wird benötigt, um Requests nach einem Reload zu authentifizieren
                const storedKey = localStorage.getItem('hf_api_key');
                if (!storedKey) {
                    // Kein gespeicherter Key -> erneut einloggen
                    localStorage.removeItem('hf_auth');
                    showLoginScreen();
                    return;
                }
                setApiKey(storedKey);
                isAuthenticated = true;
                // Prüfen, ob der Key noch gültig ist
                fetch(`${API_BASE}/entries`, { headers: getAuthHeaders() }).then(function (res) {
                    if (!res.ok) {
                        handleLogout();
                        return;
                    }
                    showMainContent();
                    loadAPIs();
                }).catch(function () {
                    handleLogout();
                });
            } else {
                showLoginScreen();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value.trim();
            if (!password) {
                showLoginError('Bitte einen API-Key eingeben.');
                return;
            }

            // API-Key gegen das Backend validieren
            setApiKey(password);
            fetch(`${API_BASE}/entries`, {
                headers: { 'Authorization': 'Bearer ' + apiKey }
            }).then(async (res) => {
                if (res.ok) {
                    localStorage.setItem('hf_auth', 'true');
                    localStorage.setItem('hf_api_key', password);
                    isAuthenticated = true;

                    const savedTheme = localStorage.getItem('hf_theme');
                    if (savedTheme) setTheme(savedTheme);
                    const savedDisplayMode = localStorage.getItem('hf_displayMode');
                    if (savedDisplayMode) setDisplayMode(savedDisplayMode);
                    document.getElementById('password').value = '';
                    showMainContent();
                    loadAPIs();
                } else {
                    setApiKey(null);
                    showLoginError('API-Key falsch oder abgelaufen.');
                    document.getElementById('password').value = '';
                }
            }).catch(() => {
                setApiKey(null);
                showLoginError('Verbindung zum Server fehlgeschlagen.');
            });
        }

        function setApiKey(val) {
            apiKey = val || null;
        }

        function getAuthHeaders(extra) {
            const headers = (extra && Object.assign({}, extra)) || {};
            if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
            return headers;
        }

        function handleLogout() {
            localStorage.removeItem('hf_auth');
            localStorage.removeItem('hf_api_key');
            localStorage.removeItem('hf_apis'); // Clear any legacy data
            setApiKey(null);
            isAuthenticated = false;
            allAPIs = [];
            showLoginScreen();
            document.getElementById('password').value = '';
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainContent').classList.remove('active');
        }

        function showMainContent() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.add('active');
        }

        async function loadAPIs() {
            try {
                const response = await fetch(`${API_BASE}/entries`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Failed to load APIs');
                allAPIs = (await response.json()).data || [];
                renderAPIs(allAPIs);
                updateStats();
            } catch (error) {
                console.error('Error loading APIs:', error);
                showLoginError('Fehler beim Laden der APIs. Bitte versuchen Sie es später erneut.');
            }
        }

        async function saveAPI(apiData) {
            try {
                const method = currentEditId ? 'PUT' : 'POST';
                const url = currentEditId ? `${API_BASE}/entries/${currentEditId}` : `${API_BASE}/entries`;
                
                const response = await fetch(url, {
                    method: method,
                    headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(apiData)
                });
                
                if (!response.ok) throw new Error('Failed to save API');
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('Error saving API:', error);
                showLoginError('Fehler beim Speichern. Bitte versuchen Sie es später erneut.');
                throw error;
            }
        }

        // SaaS-Marktplatz: Kategoriefarben für das Karten-Icon (an bestehendes Farbschema angelehnt)
                const catColors = { LLM:'#f87171', Picture:'#fb923c', Media:'#fbbf24', Video:'#34d399', Security:'#818cf8', Github:'#a78bfa', Google:'#f472b6', Other:'#94a3b8', MCP:'#2dd4bf', Mail:'#38bdf8', Finance:'#4ade80', Bot:'#c084fc', HomeAutomation:'#fda4af', '9router':'#facc15' };
                const catColor = (cat) => catColors[cat] || '#64748b';

                                // Zeigt die echte URL aus der DB (Host + Pfad) statt einer erfundenen Tools-Anzahl
                                const trimUrl = (u) => {
                                    try { const h = new URL(u.startsWith('http') ? u : 'http://' + u).host; return h.replace(/^www\./, ''); }
                                    catch (e) { return u || 'Keine URL'; }
                };

                function saasCard(api) {
                    const cat = api.category || 'Andere';
                    return `
                        <div class="api-card mk-card">
                            <div class="mk-head">
                                <div class="mk-icon" style="background:${catColor(api.category)}">${escapeHtml((api.name || '?')[0].toUpperCase())}</div>
                                <div class="mk-title">
                                    <div class="mk-name">${escapeHtml(api.name)}</div>
                                    <div class="mk-cats">${escapeHtml(cat.toUpperCase())} · API</div>
                                </div>
                                ${api.url ? `<a class="mk-globe" href="${escapeHtml(api.url)}" target="_blank" rel="noopener" title="Externen Link öffnen">🌐</a>` : ''}
                            </div>
                            <div class="mk-desc">${escapeHtml(api.notes || 'Keine Beschreibung hinterlegt.')}</div>
                            <div class="mk-meta">
                                                        <div class="mk-tools">Kategorie: ${escapeHtml(api.category || 'N/A')}</div>
                                                            <span class="category-badge cat-${escapeHtml(api.category || 'default')}">${escapeHtml(cat)}</span>
                                                            <div class="mk-actions">
                                                                                                                            <button type="button" class="mk-iconbtn" onclick="if (api.url) { window.open(api.url, '_blank', 'noopener'); } else { copyToClipboard(api.id); }" title="${api.url ? 'Externen Link öffnen' : 'API-Key kopieren'}">${api.url ? '🌐' : '📋'}</button>
                                                                                                                        ${api.apiKey ? `<button type="button" class="mk-iconbtn" onclick="copyToClipboard(${api.id})" title="API-Key kopieren">📋</button>` : ''}
                                                                                                                        </div>
                                                        </div>
                            <div class="mk-foot">
                                <button type="button" class="mk-ghost" onclick="editAPI(${api.id})">Bearbeiten</button>
                                <button type="button" class="mk-ghost mk-danger" onclick="deleteAPI(${api.id})">Löschen</button>
                            </div>
                        </div>`;
                }

                function openApi(id) {
                    const api = allAPIs.find(a => a.id === id);
                    if (!api) return;
                    if (api.url) { window.open(api.url, '_blank', 'noopener'); }
                    else if (api.apiKey) { copyToClipboard(id); }
                }

                let showApiKeys = false;
                let currentSortOrder = localStorage.getItem('hf_sortOrder') || 'alphabetical';
                let currentSortDirection = localStorage.getItem('hf_sortDirection') || 'asc';

                function renderAPIs(apis) {
                    let sortedAPIs = [...apis];
                    if (currentSortOrder === 'alphabetical') {
                        sortedAPIs.sort((a, b) => {
                            const nameA = a.name.toUpperCase();
                            const nameB = b.name.toUpperCase();
                            if (currentSortDirection === 'asc') {
                                return (nameA < nameB) ? -1 : (nameA > nameB) ? 1 : 0;
                            } else {
                                return (nameA > nameB) ? -1 : (nameA < nameB) ? 1 : 0;
                            }
                        });
                    }
                    // Add other sorting options here if needed later

                    apis = sortedAPIs;
                    const container = document.getElementById('apiContainer');
                    const empty = document.getElementById('emptyState');

                    if (apis.length === 0) {
                        container.innerHTML = '';
                        empty.style.display = 'block';
                        return;
                    }

                    empty.style.display = 'none';
                    const isSaas = document.body.classList.contains('saas-market');

                    if (isSaas) {
                        container.innerHTML = apis.map(api => saasCard(api)).join('');
                        return;
                    }

                    container.innerHTML = apis.map(api => `
                        <div class="api-card">
                            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                                <div class="api-name">${escapeHtml(api.name)}</div>
                                ${api.category ? `<span class="category-badge cat-${escapeHtml(api.category)}">${escapeHtml(api.category)}</span>` : ''}
                            </div>
                            ${api.url ? `<div style="color: var(--muted); font-size: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
                                                                                        <span title="Externer Link">🔗🌐</span>
                                                                                        <strong>URL:</strong> <code style="background: var(--surface-2); padding: 2px 4px; border-radius: 3px;">${escapeHtml(api.url)}</code>
                                                        </div>` : ''}
                            <div class="api-key" style="${showApiKeys ? '' : 'display:none;'}">
                                <span id="key-${api.id}" style="flex: 1; word-break: break-all;">${escapeHtml(api.apiKey || 'Kein Key')}</span>
                                <button type="button" class="copy-btn" onclick="copyToClipboard(${api.id})" title="Kopieren">📋</button>
                            </div>
                            ${api.notes ? `<div class="api-notes">${escapeHtml(api.notes)}</div>` : ''}
                            <div class="card-actions">
                                <button type="button" class="btn-secondary" onclick="editAPI(${api.id})">Bearbeiten</button>
                                <button type="button" class="btn-danger" onclick="deleteAPI(${api.id})">Löschen</button>
                            </div>
                        </div>
                    `).join('');
                }

        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = 'Neue API';
            document.getElementById('apiName').value = '';
            document.getElementById('apiCategory').value = '';
            document.getElementById('apiUrl').value = '';
            document.getElementById('apiKey').value = '';
            document.getElementById('apiNotes').value = '';
            document.getElementById('apiModal').classList.add('active');
            setTimeout(() => document.getElementById('apiName').focus(), 100);
        }

        function openAdmin() {
            // Admin‑Modal mit Theme‑Auswahl, Anzeige‑Modus und praktischen Optionen
                    document.querySelector('.admin-modal')?.remove();
                    const modal = document.createElement('div');
                        modal.className = 'modal admin-modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">Admin‑Einstellungen</div>
                    <div class="modal-body">
                        <h3>Theme‑Auswahl</h3>
                        <div class="theme-options">
                            <button class="btn-primary" onclick="setTheme('light')">Hell</button>
                            <button class="btn-primary" onclick="setTheme('dark')">Dunkel</button>
                            <button class="btn-primary" onclick="setTheme('blue')">Blau</button>
                            <button class="btn-primary" onclick="setTheme('green')">Grün</button>
                            <button class="btn-primary" onclick="setTheme('purple')">Lila</button>
                            <button class="btn-primary" onclick="setTheme('orange')">Orange</button>
                            <button class="btn-primary" onclick="setTheme('dsa')">Weiß / Minimal</button>
                            <button class="btn-primary" onclick="setTheme('saas')">light saas</button>
                        </div>
                        <h3>Anzeige‑Modus</h3>
                        <div class="display-options">
                            <button class="btn-primary" onclick="setDisplayMode('list')">Einspaltige Liste</button>
                            <button class="btn-primary" onclick="setDisplayMode('2col')">2‑Spalten‑Grid</button>
                            <button class="btn-primary" onclick="setDisplayMode('3col')">3‑Spalten‑Grid</button>
                            <button class="btn-primary" onclick="setDisplayMode('compact')">Kompakt‑Ansicht</button>
                            <button class="btn-primary" onclick="setDisplayMode('tile')">Kachel‑Ansicht</button>
                        </div>
                        <h3>Praktische Aktionen</h3>
                        <div class="action-options">
                            <button class="btn-primary" onclick="sortAPIs()">APIs alphabetisch sortieren</button>
                            <button class="btn-primary" onclick="toggleApiKeys()">API‑Keys ein/ausblenden</button>
                        </div>
                        <h3>Datenverwaltung</h3>
                                                <div class="action-options">
                                                    <button class="btn-secondary" onclick="document.getElementById('importFile').click()">Daten importieren</button>
                                                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="validateAndImportAPIs(event)">
                                                </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-primary" onclick="document.querySelector('.admin-modal').remove()">Schließen</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }



        
        function setDisplayMode(mode) {
            const grid = document.getElementById('apiContainer');
            grid.classList.remove('list-mode', 'grid-2col', 'grid-3col');
            document.body.classList.remove('compact-mode', 'tile-mode');
            if (mode === 'list') grid.classList.add('list-mode');
            else if (mode === '2col') grid.classList.add('grid-2col');
            else if (mode === '3col') grid.classList.add('grid-3col');
            else if (mode === 'compact') document.body.classList.add('compact-mode');
            else if (mode === 'tile') document.body.classList.add('tile-mode');
            localStorage.setItem('hf_displayMode', mode);
        }

        function setTheme(name) {

        async function handleSaveAPI(e) {
            e.preventDefault();
            const name = document.getElementById('apiName').value.trim();
            const category = document.getElementById('apiCategory').value;
            const url = document.getElementById('apiUrl').value.trim();
            const key = document.getElementById('apiKey').value.trim();
            const notes = document.getElementById('apiNotes').value.trim();

            if (!name || !key) {
                alert('Name und API-Key sind erforderlich!');
                return;
            }

            try {
                const apiData = { name, url: url || null, apiKey: key, category: category || null, notes };
                await saveAPI(apiData);
                
                showSuccess(currentEditId ? 'API aktualisiert' : 'API gespeichert');
                await loadAPIs();
                closeModal();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function editAPI(id) {
            const api = allAPIs.find(a => a.id === id);
            if (api) {
                currentEditId = id;
                document.getElementById('modalTitle').textContent = 'API bearbeiten';
                document.getElementById('apiName').value = api.name;
                document.getElementById('apiCategory').value = api.category || '';
                document.getElementById('apiUrl').value = api.url || '';
                document.getElementById('apiKey').value = api.apiKey;
                document.getElementById('apiNotes').value = api.notes || '';
                document.getElementById('apiModal').classList.add('active');
            }
        }

        async function deleteAPI(id) {
            if (confirm('Möchtest du diese API wirklich löschen?')) {
                try {
                    const response = await fetch(`${API_BASE}/entries/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                    if (!response.ok) throw new Error('Failed to delete API');
                    
                    showSuccess('API gelöscht');
                    await loadAPIs();
                } catch (error) {
                    console.error('Error:', error);
                    showLoginError('Fehler beim Löschen. Bitte versuchen Sie es später erneut.');
                }
            }
        }

        function toggleKeyVisibility(id) {
            const keyEl = document.getElementById(`key-${id}`);
            const api = allAPIs.find(a => a.id === id);
            if (keyEl.textContent === '••••••••') {
                keyEl.textContent = api.apiKey;
            } else {
                keyEl.textContent = '••••••••';
            }
        }

        function copyToClipboard(id) {
            const api = allAPIs.find(a => a.id === id);
            navigator.clipboard.writeText(api.apiKey).then(() => {
                showSuccess('In Zwischenablage kopiert!');
            }).catch(() => {
                alert('Fehler beim Kopieren');
            });
        }

        function filterAPIs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allAPIs.filter(api => 
                api.name.toLowerCase().includes(search) || 
                (api.url && api.url.toLowerCase().includes(search)) ||
                (api.category && api.category.toLowerCase().includes(search)) ||
                (api.notes && api.notes.toLowerCase().includes(search))
            );
            renderAPIs(filtered);
        }

        function toggleExportMenu() {
            document.getElementById('exportMenu').classList.toggle('open');
        }

        function closeModal() {
            document.getElementById('apiModal').classList.remove('active');
            currentEditId = null;
        }


                function toggleMenu() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('drawerOverlay').classList.toggle('open');
        }

        function closeMenu() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('open');
        }

        async function validateAndImportAPIs(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    if (!Array.isArray(json)) throw new Error('Kein gültiges JSON-Array');
                    
                            // Einfache Validierung: Prüfen ob mind. ein Eintrag name/apiKey hat
                            if (json.length === 0 || !json[0].name || !json[0].apiKey) {
                                throw new Error('Datei enthält keine gültigen API-Daten (name und apiKey erforderlich)');
                            }
                    
                            const response = await fetch(`${API_BASE}/import`, {
                                method: 'POST',
                                headers: { ...getAuthHeaders(), 'Content-Type': 'application/json' },
                                body: JSON.stringify(json)
                            });
                    
                            if (!response.ok) throw new Error('Import fehlgeschlagen');
                            showSuccess('APIs erfolgreich importiert');
                            location.reload();
                        } catch (err) {
                            console.error(err);
                            showLoginError('Import fehlgeschlagen: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                }

        // Exportieren: JSON, Markdown oder PDF
        async function exportAPIs(format) {
            try {
                const response = await fetch(`${API_BASE}/export`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Failed to export');
                const data = await response.json();

                const dateStr = new Date().toISOString().split('T')[0];
                const filePrefix = `highfish-apis-${dateStr}`;

                if (format === 'md') {
                    const md = buildMarkdown(data);
                    downloadBlob(md, `${filePrefix}.md`, 'text/markdown');
                } else if (format === 'pdf') {
                    await exportPDF(data, filePrefix);
                    return;
                } else {
                    const dataStr = JSON.stringify(data, null, 2);
                    downloadBlob(dataStr, `${filePrefix}.json`, 'application/json');
                }
                showSuccess('Daten exportiert');
            } catch (error) {
                console.error('Error:', error);
                showLoginError('Fehler beim Exportieren. Bitte versuchen Sie es später erneut.');
            }
        }

        function downloadBlob(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function buildMarkdown(data) {
            const entries = (data.data || (Array.isArray(data) ? data : [])) || [];
            let md = `# HighFish API DB\n\n**Exportiert:** ${new Date().toLocaleString('de-DE')}\n\n**Anzahl APIs:** ${entries.length}\n\n---\n\n`;
            entries.forEach(api => {
                md += `## ${api.name}\n\n`;
                if (api.category) md += `- **Kategorie:** ${api.category}\n`;
                if (api.url) md += `- **URL:** ${api.url}\n`;
                if (api.apiKey) md += `- **API-Key:** \`${api.apiKey}\`\n`;
                if (api.notes) md += `- **Notizen:** ${api.notes}\n`;
                md += `\n---\n\n`;
            });
            return md;
        }

        async function exportPDF(data, filePrefix) {
            // jsPDF per CDN laden, falls noch nicht vorhanden
            if (typeof window.jspdf === 'undefined') {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const entries = (data.data || (Array.isArray(data) ? data : [])) || [];

            doc.setFontSize(18);
            doc.text('HighFish API DB', 14, 20);
            doc.setFontSize(11);
            doc.text(`Exportiert: ${new Date().toLocaleString('de-DE')}`, 14, 28);
            doc.text(`Anzahl APIs: ${entries.length}`, 14, 34);

            let y = 44;
            doc.setFontSize(12);
            entries.forEach(api => {
                if (y > 270) {
                    doc.addPage();
                    y = 20;
                }
                doc.setFont('helvetica', 'bold');
                doc.text(api.name, 14, y);
                y += 6;
                doc.setFont('helvetica', 'normal');
                if (api.category) { doc.text(`Kategorie: ${api.category}`, 14, y); y += 5; }
                if (api.url) { doc.text(`URL: ${api.url}`, 14, y); y += 5; }
                if (api.apiKey) { doc.text(`API-Key: ${api.apiKey}`, 14, y); y += 5; }
                if (api.notes) {
                    const notes = doc.splitTextToSize(api.notes, 180);
                    doc.text('Notizen: ' + notes[0], 14, y);
                    for (let i = 1; i < notes.length; i++) {
                        y += 5;
                        if (y > 280) { doc.addPage(); y = 20; }
                        doc.text(notes[i], 14, y);
                    }
                }
                y += 8;
            });

            doc.save(`${filePrefix}.pdf`);
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(script);
            });
        }

        function updateStats() {
            document.getElementById('apiCount').textContent = allAPIs.length;
            lastUpdated = new Date();
            document.getElementById('lastUpdate').textContent = lastUpdated.toLocaleTimeString('de-DE');
            document.getElementById('statusbar').title = 'Stand: ' + lastUpdated.toLocaleString('de-DE');
        }

        function showLoginError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && document.getElementById('apiModal').classList.contains('active')) {
                if (document.getElementById('apiName').value && document.getElementById('apiKey').value) {
                    handleSaveAPI(e);
                }
            }
        });

        // Export-Menü schließen, wenn außerhalb geklickt wird
        document.addEventListener('click', (e) => {
            const dropdown = document.querySelector('.export-dropdown');
            if (dropdown && !dropdown.contains(e.target)) {
                document.getElementById('exportMenu').classList.remove('open');
            }
        });
    </script>
