<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="favicon/favicon.ico">
        <title>HighFish API DB - API Management</title>
    <style>
        :root {
            --cat-llm: #f87171;
            --cat-picture: #fb923c;
            --cat-media: #fbbf24;
            --cat-video: #34d399;
            --cat-security: #818cf8;
            --cat-github: #a78bfa;
            --cat-google: #f472b6;
            --cat-other: #94a3b8;
            /* Theme colors */
            --bg-color: #0f172a; /* default dark */
            --text-color: #f1f5f9;
        }

        .category-badge {
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 11px;
            white-space: nowrap;
            color: #fff;
            background-color: #64748b;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .cat-LLM { background-color: var(--cat-llm); }
        .cat-Picture { background-color: var(--cat-picture); }
        .cat-Media { background-color: var(--cat-media); }
        .cat-Video { background-color: var(--cat-video); }
        .cat-Security { background-color: var(--cat-security); }
        .cat-Github { background-color: var(--cat-github); }
        .cat-Google { background-color: var(--cat-google); }
        .cat-Other { background-color: var(--cat-other); }
        .cat-MCP { background-color: #2dd4bf; }
        .cat-Mail { background-color: #38bdf8; }
        .cat-Finance { background-color: #4ade80; }
        .cat-Bot { background-color: #c084fc; }
        .cat-HomeAutomation { background-color: #fda4af; }
        .cat-9router { background-color: #facc15; }
        .cat-default { background-color: #64748b; }


        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg-color, linear-gradient(135deg, #0f172a 0%, #1e293b 100%));
            color: var(--text-color, #f1f5f9);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.2);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #38bdf8, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logout-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .hamburger-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 44px;
            height: 44px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            cursor: pointer;
            padding: 10px;
            flex-shrink: 0;
        }

        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background: #38bdf8;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .drawer-overlay.open {
            display: block;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            max-width: 80vw;
            background: #1e293b;
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            padding: 20px;
            border-right: 1px solid rgba(56, 189, 248, 0.2);
            overflow-y: auto;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            float: right;
            padding: 0;
        }

        .drawer-close:hover {
            color: #f1f5f9;
        }

        .drawer ul {
            list-style: none;
            margin-top: 30px;
            clear: both;
        }

        .drawer ul li {
            margin-bottom: 5px;
        }

        .drawer ul li a {
            display: block;
            padding: 12px 14px;
            border-radius: 8px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 15px;
            transition: all 0.2s;
        }

        .drawer ul li a:hover {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
        }

        .export-menu {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            min-width: 180px;
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 100;
            overflow: hidden;
        }

        .export-menu.open {
            display: block;
        }

        .export-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            padding: 12px 16px;
            color: #e2e8f0;
            font-size: 14px;
            cursor: pointer;
            border-radius: 0;
        }

        .export-menu button:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-container {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #38bdf8;
            font-size: 24px;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            overflow: hidden;
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="password"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            color: #f1f5f9;
            font-size: 14px;
            transition: all 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: monospace;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        .error-message {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .error-message.show {
            display: block;
        }

        .main-content {
            display: none;
        }

        .main-content.active {
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            background-color: #334155;
            color: #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 22px;
            margin-bottom: 20px;
            color: #38bdf8;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding-bottom: 15px;
        }

        .modal-body {
            margin-bottom: 25px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .list-mode {
            grid-template-columns: 1fr !important;
        }
        .grid-2col {
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        .grid-3col {
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        }
                /* Kompakt-Ansicht */
                body.compact-mode .api-grid { gap: 12px; }
                body.compact-mode .api-card { padding: 14px 16px; }
                body.compact-mode .api-name { font-size: 15px; }
                body.compact-mode .api-key { font-size: 11px; padding: 7px; }
                body.compact-mode .card-actions button { padding: 6px; font-size: 11px; }
                /* Kachel-Ansicht */
                body.tile-mode .api-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
                body.tile-mode .api-card { padding: 14px; }
                body.tile-mode .api-key { font-size: 11px; flex-direction: column; align-items: center; }
                body.tile-mode .card-actions { flex-direction: column; }

        @media (max-width: 768px) {
            .api-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }

            .header-content {
                width: 100%;
                justify-content: flex-start;
                gap: 10px;
            }

            .hamburger-btn {
                display: flex;
            }

            h1 {
                font-size: 18px;
            }

            .controls {
                flex-direction: column;
            }

            .controls button,
            .controls .search-box {
                width: 100%;
            }

            .export-dropdown {
                width: 100%;
            }

            .export-dropdown > button {
                width: 100%;
            }

            .export-menu {
                position: static;
                margin-top: 4px;
                width: 100%;
            }

            button {
                width: 100%;
            }

            .logo {
                width: 40px;
                height: 40px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .stat-card {
                min-width: 120px;
            }

            .modal-content {
                padding: 20px;
            }

            .card-actions {
                flex-direction: column;
            }
        }

        .api-card {
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .api-card:hover {
            border-color: #38bdf8;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.1);
            transform: translateY(-4px);
        }

        .api-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8 0%, #06b6d4 100%);
        }

        .api-name {
            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .api-key {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            color: #cbd5e1;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .copy-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #06b6d4;
        }

        .api-notes {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(56, 189, 248, 0.1);
            max-height: 60px;
            overflow-y: auto;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .card-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .success-message {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            color: #86efac;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 6px;
            color: #f1f5f9;
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            padding: 15px;
            flex: 1;
            min-width: 150px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

                                }

                                body.saas-market .mk-icon {

                                body.saas-market .mk-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
                                body.saas-market .mk-iconbtn {

                                    transition: all .2s;

                                body.saas-market .mk-iconbtn:hover { border-color: #2563eb; color: #2563eb; }
                                body.saas-market .mk-install {
                                    background: #2563eb;
                                    color: #fff;
                                    border: none;

                                body.saas-market .mk-foot { border-top: 1px solid #f3f4f6; padding-top: 10px; display: flex; gap: 8px; }
                                body.saas-market .mk-ghost {

                                    cursor: pointer;
                                    font-weight: 600;
                                }
                                body.saas-market .mk-ghost:hover { color: #374151; }
                                body.saas-market .mk-ghost.mk-danger:hover { color: #dc2626; }

                                /* Hellgrauer Hintergrund & weiße Flächen für das SaaS-Design */
                                body.saas-market h1 { background: linear-gradient(135deg, #1d4ed8, #0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
                                body.saas-market header { border-bottom-color: #e5e7eb; }
                                body.saas-market .stat-card { background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 2px 8px rgba(17, 24, 39, 0.05); }
                                body.saas-market .stat-value { color: #2563eb; }
                                body.saas-market .stat-label { color: #6b7280; }
                                body.saas-market .modal-content { background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 20px 40px rgba(17, 24, 39, 0.15); }
                                body.saas-market .modal-header { color: #111827; border-bottom-color: #e5e7eb; }
                                body.saas-market input[type="password"], body.saas-market input[type="text"], body.saas-market textarea, body.saas-market .search-box input { background: #ffffff; border: 1px solid #d1d5db; color: #1f2937; }
                                body.saas-market input:focus, body.saas-market textarea:focus, body.saas-market .search-box input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
                                body.saas-market label { color: #374151; }
                                body.saas-market .btn-secondary { background-color: #e2e8f0; color: #334155; }
                                body.saas-market .export-menu { background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 10px 30px rgba(17, 24, 39, 0.12); }
                                body.saas-market .export-menu button { color: #374151; }
                                body.saas-market .drawer { background: #ffffff; border-right-color: #e5e7eb; }
                                body.saas-market .drawer ul li a { color: #374151; }
                                body.saas-market .drawer ul li a:hover { background: #f1f5f9; color: #1d4ed8; }
                                body.saas-market .drawer-close { color: #6b7280; }
                                body.saas-market .login-screen { background: #f3f4f6; }
                                body.saas-market .login-container { background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 20px 60px rgba(17, 24, 39, 0.12); }
                                body.saas-market .login-container h2 { color: #1d4ed8; }
                                body.saas-market .empty-state { color: #6b7280; }
                            </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="login-logo">
                <img src="./highfishapidblogo.png" alt="HighFish API DB Logo">
            </div>
            <h2>HighFish API DB</h2>
            <div class="error-message" id="loginError"></div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="password">API-Key</label>
                    <input type="password" id="password" placeholder="Gib deinen API-Key ein" autocomplete="off" required>
                </div>
                <button type="submit" class="login-btn">Anmelden</button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div class="main-content" id="mainContent">
        <div class="container">
            <!-- Header -->
            <header>
                <div class="header-content">
                    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menü öffnen" onclick="toggleMenu()">
                        <span></span><span></span><span></span>
                    </button>
                    <div class="logo">
                        <img src="./highfishapidblogo.png" alt="HighFish API DB Logo">
                    </div>
                    <h1>HighFish API DB</h1>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Abmelden</button>
            </header>

            <!-- Drawer / Mobile Menu -->
            <div class="drawer-overlay" id="drawerOverlay" onclick="closeMenu()"></div>
            <nav class="drawer" id="drawer" aria-label="Mobile Navigation">
                <button class="drawer-close" onclick="closeMenu()" aria-label="Menü schließen">✕</button>
                <ul>
                    <li><a href="#" onclick="openAddModal(); closeMenu();">＋ Neue API</a></li>
                    <li><a href="#" onclick="openAdmin(); closeMenu();">⚙️ Admin‑Einstellungen</a></li>
                    <li><a href="#" onclick="openDisplayMode(); closeMenu();">📐 Anzeige‑Modus</a></li>
                </ul>
            </nav>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="apiCount">0</div>
                    <div class="stat-label">APIs gespeichert</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="lastUpdate">-</div>
                    <div class="stat-label">Letzte Aktualisierung</div>
                </div>
            </div>

            <!-- Success Message -->
            <div class="success-message" id="successMsg"></div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn-primary" onclick="openAddModal()">+ Neue API</button>
                <div class="export-dropdown">
                    <button class="btn-secondary" onclick="toggleExportMenu()">📥 Exportieren ▾</button>
                    <div class="export-menu" id="exportMenu">
                        <button onclick="exportAPIs('json')">📄 JSON</button>
                        <button onclick="exportAPIs('md')">📝 Markdown</button>
                        <button onclick="exportAPIs('pdf')">📕 PDF</button>
                    </div>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Nach API-Name suchen..." onkeyup="filterAPIs()">
                </div>
            </div>

            <!-- API Grid -->
            <div id="apiContainer" class="api-grid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <p style="font-size: 40px; margin-bottom: 10px;">📭</p>
                <p>Noch keine APIs gespeichert.</p>
                <p style="font-size: 12px; margin-top: 5px;">Klicke auf "Neue API" um eine hinzuzufügen.</p>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="apiModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Neue API</div>
            <form onsubmit="handleSaveAPI(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="apiName">API Name *</label>
                        <input type="text" id="apiName" placeholder="z.B. GitHub API" required>
                    </div>
                    <div class="form-group">
                        <label for="apiCategory">Kategorie (optional)</label>
                        <select id="apiCategory">
                            <option value="">— keine Auswahl —</option>
                            <option>LLM</option>
                            <option>Picture</option>
                            <option>Media</option>
                            <option>Video</option>
                            <option>Security</option>
                            <option>Github</option>
                            <option>Google</option>
                            <option>9router</option>
                            <option>MCP</option>
                            <option>Other</option>
                            <option>Mail</option>
                            <option>Finance</option>
                            <option>Bot</option>
                            <option>HomeAutomation</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="apiUrl">API URL (optional)</label>
                        <input type="text" id="apiUrl" placeholder="z.B. https://api.github.com">
                    </div>
                    <div class="form-group">
                        <label for="apiKey">API Key *</label>
                        <input type="text" id="apiKey" placeholder="Dein geheimer API-Schlüssel" required>
                    </div>
                    <div class="form-group">
                        <label for="apiNotes">Notizen (optional)</label>
                        <textarea id="apiNotes" placeholder="Zusätzliche Informationen, Endpoint, Gültigkeitsdauer, etc."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Abbrechen</button>
                    <button type="submit" class="btn-primary">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let currentEditId = null;
        let allAPIs = [];
        let isAuthenticated = false;
        // API-Key für die Backend-Authentifizierung wird zur Laufzeit validiert,
        // nicht im Client hartcodiert.
        let apiKey = null;

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const auth = localStorage.getItem('hf_auth');
            if (auth === 'true') {
                // Key wird benötigt, um Requests nach einem Reload zu authentifizieren
                const storedKey = localStorage.getItem('hf_api_key');
                if (!storedKey) {
                    // Kein gespeicherter Key -> erneut einloggen
                    localStorage.removeItem('hf_auth');
                    showLoginScreen();
                    return;
                }
                setApiKey(storedKey);
                isAuthenticated = true;
                // Prüfen, ob der Key noch gültig ist
                fetch(`${API_BASE}/entries`, { headers: getAuthHeaders() }).then(function (res) {
                    if (!res.ok) {
                        handleLogout();
                        return;
                    }
                    showMainContent();
                    loadAPIs();
                }).catch(function () {
                    handleLogout();
                });
            } else {
                showLoginScreen();
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value.trim();
            if (!password) {
                showLoginError('Bitte einen API-Key eingeben.');
                return;
            }

            // API-Key gegen das Backend validieren
            setApiKey(password);
            fetch(`${API_BASE}/entries`, {
                headers: { 'Authorization': 'Bearer ' + apiKey }
            }).then(async (res) => {
                if (res.ok) {
                    localStorage.setItem('hf_auth', 'true');
                    localStorage.setItem('hf_api_key', password);
                    isAuthenticated = true;

                    const savedTheme = localStorage.getItem('hf_theme');
                    if (savedTheme) setTheme(savedTheme);
                    const savedDisplayMode = localStorage.getItem('hf_displayMode');
                    if (savedDisplayMode) setDisplayMode(savedDisplayMode);
                    document.getElementById('password').value = '';
                    showMainContent();
                    loadAPIs();
                } else {
                    setApiKey(null);
                    showLoginError('API-Key falsch oder abgelaufen.');
                    document.getElementById('password').value = '';
                }
            }).catch(() => {
                setApiKey(null);
                showLoginError('Verbindung zum Server fehlgeschlagen.');
            });
        }

        function setApiKey(val) {
            apiKey = val || null;
        }

        function getAuthHeaders(extra) {
            const headers = (extra && Object.assign({}, extra)) || {};
            if (apiKey) headers['Authorization'] = 'Bearer ' + apiKey;
            return headers;
        }

        function handleLogout() {
            localStorage.removeItem('hf_auth');
            localStorage.removeItem('hf_api_key');
            localStorage.removeItem('hf_apis'); // Clear any legacy data
            setApiKey(null);
            isAuthenticated = false;
            allAPIs = [];
            showLoginScreen();
            document.getElementById('password').value = '';
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainContent').classList.remove('active');
        }

        function showMainContent() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.add('active');
        }

        async function loadAPIs() {
            try {
                const response = await fetch(`${API_BASE}/entries`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Failed to load APIs');
                allAPIs = (await response.json()).data || [];
                renderAPIs(allAPIs);
                updateStats();
            } catch (error) {
                console.error('Error loading APIs:', error);
                showLoginError('Fehler beim Laden der APIs. Bitte versuchen Sie es später erneut.');
            }
        }

        async function saveAPI(apiData) {
            try {
                const method = currentEditId ? 'PUT' : 'POST';
                const url = currentEditId ? `${API_BASE}/entries/${currentEditId}` : `${API_BASE}/entries`;
                
                const response = await fetch(url, {
                    method: method,
                    headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(apiData)
                });
                
                if (!response.ok) throw new Error('Failed to save API');
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('Error saving API:', error);
                showLoginError('Fehler beim Speichern. Bitte versuchen Sie es später erneut.');
                throw error;
            }
        }

        // SaaS-Marktplatz: Kategoriefarben für das Karten-Icon (an bestehendes Farbschema angelehnt)
                const catColors = { LLM:'#f87171', Picture:'#fb923c', Media:'#fbbf24', Video:'#34d399', Security:'#818cf8', Github:'#a78bfa', Google:'#f472b6', Other:'#94a3b8', MCP:'#2dd4bf', Mail:'#38bdf8', Finance:'#4ade80', Bot:'#c084fc', HomeAutomation:'#fda4af', '9router':'#facc15' };
                const catColor = (cat) => catColors[cat] || '#64748b';

                // "Tools"-Anzahl: abgeleitet aus der Anzahl der Einträge in derselben Kategorie (DB kennt keine eigene Tools-Anzahl)
                const mkSegs = (n) => {
                    const filled = Math.max(1, Math.min(5, n));
                    return [1,2,3,4,5].map(i => `<span class="mk-seg${i <= filled ? ' on' : ''}"></span>`).join('');
                };

                function saasCard(api, counts) {
                    const cat = api.category || 'Andere';
                    return `
                        <div class="api-card mk-card">
                            <div class="mk-head">
                                <div class="mk-icon" style="background:${catColor(api.category)}">${escapeHtml((api.name || '?')[0].toUpperCase())}</div>
                                <div class="mk-title">
                                    <div class="mk-name">${escapeHtml(api.name)}</div>
                                    <div class="mk-cats">${escapeHtml(cat.toUpperCase())} · API</div>
                                </div>
                                ${api.url ? `<a class="mk-globe" href="${escapeHtml(api.url)}" target="_blank" rel="noopener" title="Externen Link öffnen">🌐</a>` : ''}
                            </div>
                            <div class="mk-desc">${escapeHtml(api.notes || 'Keine Beschreibung hinterlegt.')}</div>
                            <div class="mk-meta">
                                <div class="mk-tools"><span class="mk-tools-num">${counts[cat] || 1}</span> Tools</div>
                                <div class="mk-segs">${mkSegs(counts[cat] || 1)}</div>
                                <span class="category-badge cat-${escapeHtml(api.category || 'default')}">${escapeHtml(cat)}</span>
                                <div class="mk-actions">
                                    <button type="button" class="mk-iconbtn" onclick="copyToClipboard(${api.id})" title="API-Key kopieren">📋</button>
                                    <button type="button" class="mk-install" onclick="openApi(${api.id})">Install<span class="mk-arrow">→</span></button>
                                </div>
                            </div>
                            <div class="mk-foot">
                                <button type="button" class="mk-ghost" onclick="editAPI(${api.id})">Bearbeiten</button>
                                <button type="button" class="mk-ghost mk-danger" onclick="deleteAPI(${api.id})">Löschen</button>
                            </div>
                        </div>`;
                }

                function openApi(id) {
                    const api = allAPIs.find(a => a.id === id);
                    if (!api) return;
                    // "Install" öffnet die hinterlegte URL bzw. kopiert bei fehlender URL den API-Key
                    if (api.url) { window.open(api.url, '_blank', 'noopener'); }
                    else { copyToClipboard(id); }
                }

                function renderAPIs(apis) {
                    const container = document.getElementById('apiContainer');
                    const empty = document.getElementById('emptyState');

                    if (apis.length === 0) {
                        container.innerHTML = '';
                        empty.style.display = 'block';
                        return;
                    }

                    empty.style.display = 'none';
                    const isSaas = document.body.classList.contains('saas-market');

                    if (isSaas) {
                        const counts = {};
                        apis.forEach(a => { const c = a.category || 'Andere'; counts[c] = (counts[c] || 0) + 1; });
                        container.innerHTML = apis.map(api => saasCard(api, counts)).join('');
                        return;
                    }

                    container.innerHTML = apis.map(api => `
                        <div class="api-card">
                            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                                <div class="api-name">${escapeHtml(api.name)}</div>
                                ${api.category ? `<span class="category-badge cat-${escapeHtml(api.category)}">${escapeHtml(api.category)}</span>` : ''}
                            </div>
                            ${api.url ? `<div style="color: #94a3b8; font-size: 12px; margin-bottom: 10px;">
                                <strong>URL:</strong> <code style="background: #0f172a; padding: 2px 4px; border-radius: 3px;">${escapeHtml(api.url)}</code>
                            </div>` : ''}
                            <div class="api-key">
                                <span id="key-${api.id}" style="flex: 1; word-break: break-all;">••••••••</span>
                                <button type="button" class="copy-btn" onclick="toggleKeyVisibility(${api.id})" title="Anzeigen/Verbergen">👁️</button>
                                <button type="button" class="copy-btn" onclick="copyToClipboard(${api.id})" title="Kopieren">📋</button>
                            </div>
                            ${api.notes ? `<div class="api-notes">${escapeHtml(api.notes)}</div>` : ''}
                            <div class="card-actions">
                                <button type="button" class="btn-secondary" onclick="editAPI(${api.id})">Bearbeiten</button>
                                <button type="button" class="btn-danger" onclick="deleteAPI(${api.id})">Löschen</button>
                            </div>
                        </div>
                    `).join('');
                }

        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = 'Neue API';
            document.getElementById('apiName').value = '';
            document.getElementById('apiCategory').value = '';
            document.getElementById('apiUrl').value = '';
            document.getElementById('apiKey').value = '';
            document.getElementById('apiNotes').value = '';
            document.getElementById('apiModal').classList.add('active');
            setTimeout(() => document.getElementById('apiName').focus(), 100);
        }

        function openAdmin() {
            // Admin‑Modal mit Theme‑Auswahl, Anzeige‑Modus und praktischen Optionen
                    document.querySelector('.admin-modal')?.remove();
                    const modal = document.createElement('div');
                        modal.className = 'modal admin-modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">Admin‑Einstellungen</div>
                    <div class="modal-body">
                        <h3>Theme‑Auswahl</h3>
                        <div class="theme-options">
                            <button class="btn-primary" onclick="setTheme('light')">Hell</button>
                            <button class="btn-primary" onclick="setTheme('dark')">Dunkel</button>
                            <button class="btn-primary" onclick="setTheme('blue')">Blau</button>
                            <button class="btn-primary" onclick="setTheme('green')">Grün</button>
                            <button class="btn-primary" onclick="setTheme('purple')">Lila</button>
                            <button class="btn-primary" onclick="setTheme('orange')">Orange</button>
                            <button class="btn-primary" onclick="setTheme('dsa')">Weiß / Minimal</button>
                            <button class="btn-primary" onclick="setTheme('saas')">light saas</button>
                        </div>
                        <h3>Anzeige‑Modus</h3>
                        <div class="display-options">
                            <button class="btn-primary" onclick="setDisplayMode('list')">Einspaltige Liste</button>
                            <button class="btn-primary" onclick="setDisplayMode('2col')">2‑Spalten‑Grid</button>
                            <button class="btn-primary" onclick="setDisplayMode('3col')">3‑Spalten‑Grid</button>
                            <button class="btn-primary" onclick="setDisplayMode('compact')">Kompakt‑Ansicht</button>
                            <button class="btn-primary" onclick="setDisplayMode('tile')">Kachel‑Ansicht</button>
                        </div>
                        <h3>Praktische Aktionen</h3>
                        <div class="action-options">
                            <button class="btn-primary" onclick="sortAPIs()">APIs alphabetisch sortieren</button>
                            <button class="btn-primary" onclick="toggleApiKeys()">API‑Keys ein/ausblenden</button>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-primary" onclick="document.querySelector('.admin-modal').remove()">Schließen</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }



        function openTheme() {
            // Platzhalter‑Modal – später Theme‑Auswahl einbauen
            const modal = document.createElement('div');
            modal.className = 'modal theme-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">Theme‑Auswahl</div>
                    <div class="modal-body">
                        <p>Wähle ein Theme aus (z. B. Licht/Dunkel).</p>
                        <button class="btn-primary" onclick="setTheme('light')">Helles Theme</button>
                        <button class="btn-primary" onclick="setTheme('dark')">Dunkles Theme</button>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-primary" onclick="document.querySelector('.theme-modal').remove()">Schließen</button>
                    </div>
                </div>`;
            document.body.appendChild(modal);
        }
        
        function setDisplayMode(mode) {
            const grid = document.getElementById('apiContainer');
            grid.classList.remove('list-mode', 'grid-2col', 'grid-3col');
            document.body.classList.remove('compact-mode', 'tile-mode');
            if (mode === 'list') grid.classList.add('list-mode');
            else if (mode === '2col') grid.classList.add('grid-2col');
            else if (mode === '3col') grid.classList.add('grid-3col');
            else if (mode === 'compact') document.body.classList.add('compact-mode');
            else if (mode === 'tile') document.body.classList.add('tile-mode');
            localStorage.setItem('hf_displayMode', mode);
        }

        function setTheme(name) {
            const themes = {
                light:  { '--bg-color': '#ffffff', '--text-color': '#111827', '--card-bg': '#f9fafb', '--card-border': 'rgba(0,0,0,0.1)', '--accent': '#38bdf8' },
                dark:   { '--bg-color': '#0f172a', '--text-color': '#f1f5f9', '--card-bg': '#1e293b', '--card-border': 'rgba(56,189,248,0.2)', '--accent': '#38bdf8' },
                blue:   { '--bg-color': '#0e1a40', '--text-color': '#e0f2fe', '--card-bg': '#1e293b', '--card-border': 'rgba(96,165,250,0.2)', '--accent': '#60a5fa' },
                green:  { '--bg-color': '#041f13', '--text-color': '#d1fae5', '--card-bg': '#1e293b', '--card-border': 'rgba(52,211,153,0.2)', '--accent': '#34d399' },
                purple: { '--bg-color': '#1e1b4b', '--text-color': '#e9d5ff', '--card-bg': '#1e293b', '--card-border': 'rgba(167,139,250,0.2)', '--accent': '#a78bfa' },
                orange: { '--bg-color': '#2c1a00', '--text-color': '#ffecd5', '--card-bg': '#1e293b', '--card-border': 'rgba(251,146,60,0.2)', '--accent': '#fb923c' },
                                dsa:    { '--bg-color': '#f5f7fa', '--text-color': '#1f2937', '--card-bg': '#ffffff', '--card-border': 'rgba(17,24,39,0.06)', '--accent': '#0ea5e9' },
                                saas:   { '--bg-color': '#f3f4f6', '--text-color': '#1f2937', '--card-bg': '#ffffff', '--card-border': 'rgba(17,24,39,0.08)', '--accent': '#2563eb' }
                            };
                            const theme = themes[name] || themes.dark;
                            document.body.classList.toggle('dsa-design', name === 'dsa');
                            document.body.classList.toggle('saas-market', name === 'saas');
                            for (const [k, v] of Object.entries(theme)) {
                                document.documentElement.style.setProperty(k, v);
                            }
                            // Karten bei Design-Wechsel neu rendern (SaaS-Ansicht hat eigene Kartenstruktur)
                            if (typeof allAPIs !== 'undefined' && allAPIs.length > 0) renderAPIs(allAPIs);
            localStorage.setItem('hf_theme', name);
        }


        async function handleSaveAPI(e) {
            e.preventDefault();
            const name = document.getElementById('apiName').value.trim();
            const category = document.getElementById('apiCategory').value;
            const url = document.getElementById('apiUrl').value.trim();
            const key = document.getElementById('apiKey').value.trim();
            const notes = document.getElementById('apiNotes').value.trim();

            if (!name || !key) {
                alert('Name und API-Key sind erforderlich!');
                return;
            }

            try {
                const apiData = { name, url: url || null, apiKey: key, category: category || null, notes };
                await saveAPI(apiData);
                
                showSuccess(currentEditId ? 'API aktualisiert' : 'API gespeichert');
                await loadAPIs();
                closeModal();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function editAPI(id) {
            const api = allAPIs.find(a => a.id === id);
            if (api) {
                currentEditId = id;
                document.getElementById('modalTitle').textContent = 'API bearbeiten';
                document.getElementById('apiName').value = api.name;
                document.getElementById('apiCategory').value = api.category || '';
                document.getElementById('apiUrl').value = api.url || '';
                document.getElementById('apiKey').value = api.apiKey;
                document.getElementById('apiNotes').value = api.notes || '';
                document.getElementById('apiModal').classList.add('active');
            }
        }

        async function deleteAPI(id) {
            if (confirm('Möchtest du diese API wirklich löschen?')) {
                try {
                    const response = await fetch(`${API_BASE}/entries/${id}`, { method: 'DELETE', headers: getAuthHeaders() });
                    if (!response.ok) throw new Error('Failed to delete API');
                    
                    showSuccess('API gelöscht');
                    await loadAPIs();
                } catch (error) {
                    console.error('Error:', error);
                    showLoginError('Fehler beim Löschen. Bitte versuchen Sie es später erneut.');
                }
            }
        }

        function toggleKeyVisibility(id) {
            const keyEl = document.getElementById(`key-${id}`);
            const api = allAPIs.find(a => a.id === id);
            if (keyEl.textContent === '••••••••') {
                keyEl.textContent = api.apiKey;
            } else {
                keyEl.textContent = '••••••••';
            }
        }

        function copyToClipboard(id) {
            const api = allAPIs.find(a => a.id === id);
            navigator.clipboard.writeText(api.apiKey).then(() => {
                showSuccess('In Zwischenablage kopiert!');
            }).catch(() => {
                alert('Fehler beim Kopieren');
            });
        }

        function filterAPIs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allAPIs.filter(api => 
                api.name.toLowerCase().includes(search) || 
                (api.url && api.url.toLowerCase().includes(search)) ||
                (api.category && api.category.toLowerCase().includes(search)) ||
                (api.notes && api.notes.toLowerCase().includes(search))
            );
            renderAPIs(filtered);
        }

        function toggleExportMenu() {
            document.getElementById('exportMenu').classList.toggle('open');
        }

        function closeModal() {
            document.getElementById('apiModal').classList.remove('active');
            currentEditId = null;
        }

        function openDisplayMode() {
                    document.querySelector('.admin-modal')?.remove();
                    openAdmin();
                }

                function toggleMenu() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('drawerOverlay').classList.toggle('open');
        }

        function closeMenu() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('open');
        }

        // Exportieren: JSON, Markdown oder PDF
        async function exportAPIs(format) {
            try {
                const response = await fetch(`${API_BASE}/export`, { headers: getAuthHeaders() });
                if (!response.ok) throw new Error('Failed to export');
                const data = await response.json();

                const dateStr = new Date().toISOString().split('T')[0];
                const filePrefix = `highfish-apis-${dateStr}`;

                if (format === 'md') {
                    const md = buildMarkdown(data);
                    downloadBlob(md, `${filePrefix}.md`, 'text/markdown');
                } else if (format === 'pdf') {
                    await exportPDF(data, filePrefix);
                    return;
                } else {
                    const dataStr = JSON.stringify(data, null, 2);
                    downloadBlob(dataStr, `${filePrefix}.json`, 'application/json');
                }
                showSuccess('Daten exportiert');
            } catch (error) {
                console.error('Error:', error);
                showLoginError('Fehler beim Exportieren. Bitte versuchen Sie es später erneut.');
            }
        }

        function downloadBlob(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function buildMarkdown(data) {
            const entries = (data.data || (Array.isArray(data) ? data : [])) || [];
            let md = `# HighFish API DB\n\n**Exportiert:** ${new Date().toLocaleString('de-DE')}\n\n**Anzahl APIs:** ${entries.length}\n\n---\n\n`;
            entries.forEach(api => {
                md += `## ${api.name}\n\n`;
                if (api.category) md += `- **Kategorie:** ${api.category}\n`;
                if (api.url) md += `- **URL:** ${api.url}\n`;
                if (api.apiKey) md += `- **API-Key:** \`${api.apiKey}\`\n`;
                if (api.notes) md += `- **Notizen:** ${api.notes}\n`;
                md += `\n---\n\n`;
            });
            return md;
        }

        async function exportPDF(data, filePrefix) {
            // jsPDF per CDN laden, falls noch nicht vorhanden
            if (typeof window.jspdf === 'undefined') {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const entries = (data.data || (Array.isArray(data) ? data : [])) || [];

            doc.setFontSize(18);
            doc.text('HighFish API DB', 14, 20);
            doc.setFontSize(11);
            doc.text(`Exportiert: ${new Date().toLocaleString('de-DE')}`, 14, 28);
            doc.text(`Anzahl APIs: ${entries.length}`, 14, 34);

            let y = 44;
            doc.setFontSize(12);
            entries.forEach(api => {
                if (y > 270) {
                    doc.addPage();
                    y = 20;
                }
                doc.setFont('helvetica', 'bold');
                doc.text(api.name, 14, y);
                y += 6;
                doc.setFont('helvetica', 'normal');
                if (api.category) { doc.text(`Kategorie: ${api.category}`, 14, y); y += 5; }
                if (api.url) { doc.text(`URL: ${api.url}`, 14, y); y += 5; }
                if (api.apiKey) { doc.text(`API-Key: ${api.apiKey}`, 14, y); y += 5; }
                if (api.notes) {
                    const notes = doc.splitTextToSize(api.notes, 180);
                    doc.text('Notizen: ' + notes[0], 14, y);
                    for (let i = 1; i < notes.length; i++) {
                        y += 5;
                        if (y > 280) { doc.addPage(); y = 20; }
                        doc.text(notes[i], 14, y);
                    }
                }
                y += 8;
            });

            doc.save(`${filePrefix}.pdf`);
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
                document.head.appendChild(script);
            });
        }

        function updateStats() {
            document.getElementById('apiCount').textContent = allAPIs.length;
            const now = new Date().toLocaleTimeString('de-DE');
            document.getElementById('lastUpdate').textContent = now;
        }

        function showLoginError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && document.getElementById('apiModal').classList.contains('active')) {
                if (document.getElementById('apiName').value && document.getElementById('apiKey').value) {
                    handleSaveAPI(e);
                }
            }
        });

        // Export-Menü schließen, wenn außerhalb geklickt wird
        document.addEventListener('click', (e) => {
            const dropdown = document.querySelector('.export-dropdown');
            if (dropdown && !dropdown.contains(e.target)) {
                document.getElementById('exportMenu').classList.remove('open');
            }
        });
    </script>
</body>
</html>
